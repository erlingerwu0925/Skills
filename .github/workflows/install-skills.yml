name: Verify eight writing skills

# Skill files are already committed to this repository.
# Run this read-only check manually; do not auto-push or overwrite files.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Skill definitions and bundled resources
        shell: bash
        run: |
          set -euo pipefail
          for skill in \
            humanizer-chinese \
            humanizer-zh \
            general-writing \
            academic-voice \
            professional-proofreader \
            scientific-writing \
            plain-writing \
            docx; do
            file=".agents/skills/$skill/SKILL.md"
            test -s "$file" || { echo "::error::Missing or empty $file"; exit 1; }
            grep -q '^name:' "$file" || { echo "::error::Missing name frontmatter in $file"; exit 1; }
            echo "Found $skill"
          done
          test -s .agents/skills/docx/LICENSE.txt
          test -s .agents/skills/docx/scripts/office/validate.py
          test -s .agents/skills/scientific-writing/references/evidence_workflow.md
          test -s .agents/skills/scientific-writing/scripts/check_references.py
          test -s .agents/skills/humanizer-chinese/LICENSE
          test -s .agents/skills/humanizer-zh/LICENSE
          echo "All eight Skill definitions and critical supporting files are present."

      - name: Check Python helper script syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = sorted(Path(".agents/skills").rglob("*.py"))
          for p in paths:
              ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
          print(f"Syntax checked: {len(paths)} Python scripts")
          PY
