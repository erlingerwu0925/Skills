name: Install eight writing skills
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-skills.yml'
      - 'scripts/sync-skills.sh'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch upstream Skill directories with scripts and licenses
        shell: bash
        run: bash scripts/sync-skills.sh
      - name: Commit synchronized Skills
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills UPSTREAM_VERSIONS.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Import eight upstream writing Skills for Codex"
            git push origin HEAD:main
          fi
